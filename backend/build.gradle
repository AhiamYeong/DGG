plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'S13P21A305'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
//	implementation 'org.springframework.cloud:spring-cloud-starter-zookeeper-config'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// fcm
	implementation 'com.google.firebase:firebase-admin:9.4.3'

	// jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
	implementation 'org.projectlombok:lombok:1.18.20'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:JJWT_RELEASE_VERSION'
	implementation 'com.google.api-client:google-api-client:2.6.0'

	// .env 파일 자동 로드
	implementation 'me.paulschwarz:spring-dotenv:3.0.0'
	implementation 'io.github.cdimascio:dotenv-java:3.0.0'

	//테스트
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'

	// spark 의존성
	implementation("org.apache.spark:spark-core_2.12:3.5.1") {
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
		exclude group: 'org.slf4j', module: 'slf4j-reload4j'
	}
	implementation("org.apache.spark:spark-sql_2.12:3.5.1") {
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
		exclude group: 'org.slf4j', module: 'slf4j-reload4j'
	}
	runtimeOnly 'javax.servlet:javax.servlet-api:3.1.0'


	// Hive/Spark Thrift JDBC
//	implementation 'org.apache.hive:hive-jdbc:3.1.3'
//	implementation 'org.apache.hadoop:hadoop-common:3.3.6'

	//redis 의존성
	implementation 'org.springframework.boot:spring-boot-starter-data-redis' // 필수
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.apache.commons:commons-pool2'

	runtimeOnly "org.apache.logging.log4j:log4j-core:2.19.0"
	runtimeOnly "org.apache.logging.log4j:log4j-api:2.19.0"

}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed", "standardOut", "standardError"
		showStandardStreams = true
	}
}

configurations.all {
	exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
	exclude group: 'org.slf4j',                module: 'slf4j-reload4j'
}

tasks.named('bootRun') {
	jvmArgs '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED',
			'--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
			'--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED',
			'--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
}
